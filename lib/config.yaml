app:
  version: 0.1.2
  buildNumber: beta-003
  # 生产配置
  checkUpdateUrl: 'https://cloud.waveyo.cn/mirror/YoLightTransfer/version.json'
  # 开发配置
#  checkUpdateUrl: 'http://192.168.1.220:5500/1/version.json'
  startupUpdateCheck: true
  updateCheckTimeout: 8

# 数据收集配置
data_collection:
  # 生产环境API端点
  api_endpoint: 'https://api.waveyo.cn/network-data'
  # 开发环境API端点
#  api_endpoint: 'http://192.168.1.220:5500/network-data'
  enabled: false  # 默认禁用数据收集
  batch_size: 50
  upload_interval_minutes: 30
  include_location: false
  anonymize_data: true

about: |
  YoLightTransfer BETA v0.1.2
  
  一个轻量级的局域网跨平台文件传输工具
  
  功能特性：
  • 支持 Android、Windows 等多平台
  • 快速的 UDP 设备发现
  • 高效的 HTTP 文件传输
  • 实时传输日志记录
  
  开发者：WaveYo.co
  临时官网：https://ylt.waveyo.cn
  反馈交流欢迎加入 [QQ群](https://qm.qq.com/q/cOqjzHt5TO)
